name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=critical

      - name: Verify production Compose networking
        env:
          APP_IMAGE: ghcr.io/plutolabsapps/korekto:test
        run: |
          COMPOSE_JSON="$(docker compose -f compose.yaml -f compose.prod.yaml config --format json)"
          export COMPOSE_JSON
          node --input-type=module -e '
            const config = JSON.parse(process.env.COMPOSE_JSON);
            const app = config.services.app;
            if (app.build) throw new Error("Production app has a build section");
            if (app.ports?.length !== 1 || app.ports[0].host_ip !== "127.0.0.1" || app.ports[0].target !== 3000) {
              throw new Error("Production app must publish only container port 3000 on 127.0.0.1");
            }
            if (Object.keys(config.services).length !== 1) {
              throw new Error("Production Compose must contain only the app service");
            }
          '
