name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.release.outputs.image }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Resolve release coordinates
        id: release
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="${WORKFLOW_RUN_SHA:-$GITHUB_SHA}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=$image:$sha" >> "$GITHUB_OUTPUT"
          echo "image_name=$image" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.image_name }}:${{ steps.release.outputs.sha }}
            ${{ env.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Prepare private deployment files
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$ENV_FILE" > "$RUNNER_TEMP/korekto-$RUN_ID.env"
          printf 'APP_IMAGE=%s\nGHCR_USERNAME=%s\nGHCR_READ_TOKEN=%s\n' \
            "$APP_IMAGE" "$GHCR_USERNAME" "$GHCR_READ_TOKEN" \
            > "$RUNNER_TEMP/korekto-$RUN_ID.release"
          cp scripts/remote-deploy.sh "$RUNNER_TEMP/korekto-$RUN_ID.deploy.sh"
          tar -czf "$RUNNER_TEMP/korekto-$RUN_ID.tar.gz" compose.yaml compose.prod.yaml

      - name: Configure Ed25519-only SSH
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_HOST_FINGERPRINT: ${{ secrets.HETZNER_HOST_FINGERPRINT }}
          HETZNER_PORT: ${{ secrets.HETZNER_SSH_PORT || 22 }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_USERNAME: ${{ secrets.HETZNER_USERNAME }}
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="$RUNNER_TEMP/ssh"
          mkdir -p "$ssh_dir"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$ssh_dir/deploy_key"

          ssh-keyscan -t ed25519 -p "$HETZNER_PORT" "$HETZNER_HOST" > "$ssh_dir/known_hosts"
          actual_fingerprint=$(ssh-keygen -lf "$ssh_dir/known_hosts" | cut -d ' ' -f2 | sort -u)
          test "$actual_fingerprint" = "$HETZNER_HOST_FINGERPRINT"

          cat > "$ssh_dir/config" <<EOF
          Host korekto-deploy
            HostName $HETZNER_HOST
            Port $HETZNER_PORT
            User $HETZNER_USERNAME
            IdentityFile $ssh_dir/deploy_key
            UserKnownHostsFile $ssh_dir/known_hosts
            BatchMode yes
            ConnectTimeout 30
            HostKeyAlgorithms ssh-ed25519
            IdentitiesOnly yes
            PasswordAuthentication no
            StrictHostKeyChecking yes
          EOF

      - name: Copy environment and Compose configuration
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          scp -F "$RUNNER_TEMP/ssh/config" \
            "$RUNNER_TEMP/korekto-$RUN_ID.env" \
            "$RUNNER_TEMP/korekto-$RUN_ID.release" \
            "$RUNNER_TEMP/korekto-$RUN_ID.deploy.sh" \
            "$RUNNER_TEMP/korekto-$RUN_ID.tar.gz" \
            korekto-deploy:/tmp/

      - name: Deploy release and verify application health
        env:
          RUN_ID: ${{ github.run_id }}
        run: ssh -F "$RUNNER_TEMP/ssh/config" korekto-deploy "bash /tmp/korekto-$RUN_ID.deploy.sh $RUN_ID"
