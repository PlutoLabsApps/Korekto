name: korekto

services:
  app:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      NUXT_PUBLIC_SITE_NAME: ${NUXT_PUBLIC_SITE_NAME:-Korekto}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NUXT_OBJECT_STORAGE_ENDPOINT: ${NUXT_OBJECT_STORAGE_ENDPOINT:-}
      NUXT_OBJECT_STORAGE_REGION: ${NUXT_OBJECT_STORAGE_REGION:-}
      NUXT_OBJECT_STORAGE_BUCKET: ${NUXT_OBJECT_STORAGE_BUCKET:-}
      NUXT_OBJECT_STORAGE_ACCESS_KEY_ID: ${NUXT_OBJECT_STORAGE_ACCESS_KEY_ID:-}
      NUXT_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${NUXT_OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    restart: unless-stopped
